apiVersion: v1
kind: Service
metadata:
  name: nfs-server
  namespace: default
spec:
  clusterIP: 10.96.78.207
  selector:
    app: nfs-server
  ports:
    - port: 2049
      targetPort: 2049
      protocol: TCP
      name: nfs
    - port: 111
      targetPort: 111
      protocol: TCP
      name: rpcbind
    - port: 32765
      targetPort: 32765
      protocol: TCP
      name: mountd
    - port: 32767
      targetPort: 32767
      protocol: TCP
      name: statd
  type: ClusterIP
