apiVersion: apps/v1
kind: Deployment
metadata:
  name: nfs-server
  namespace: default
  labels:
    app: nfs-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nfs-server
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: nfs-server
    spec:
      # 이 파드가 죽으면 stateful 앱 전체(jenkins/mail/sudoku/wireguard)의 I/O 가 멈춘다.
      # 스케줄러가 마음대로 옮기지 못하도록 저장소 노드에 고정하고, 자원 압박 시
      # 가장 먼저 쫓겨나는 BestEffort 를 벗어나기 위해 request 를 명시한다.
      nodeSelector:
        role/storage: "true"
      priorityClassName: system-cluster-critical
      containers:
        - name: nfs-server
          image: docker.io/alpine:3.19
          ports:
            - containerPort: 2049
              name: nfs
            - containerPort: 111
              name: rpcbind
            - containerPort: 32765
              name: mountd
            - containerPort: 32767
              name: statd
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
          command:
            - /bin/sh
            - -c
            - |
              set -e
              # nfs-utils 를 네트워크에서 받아오면, 재기동 시점에 egress 나 알파인
              # 미러가 막혔을 때 NFS 가 영영 안 뜨고 stateful 앱 전체가 정지한다.
              # 패키지를 데이터 볼륨(/shared)에 미리 캐시해 두고 그걸 먼저 쓴다.
              # 볼륨은 이 스크립트보다 먼저 마운트되므로 항상 읽을 수 있다.
              if ! apk add --no-network --allow-untrusted /shared/.nfs-bootstrap/*.apk; then
                echo "local bootstrap failed, falling back to network"
                apk add --no-cache nfs-utils
              fi
              mkdir -p /shared /run/nfs /var/lib/nfs/sm /var/lib/nfs/sm.bak /var/lib/nfs/v4recovery
              echo "/shared *(rw,no_subtree_check,no_root_squash,sync)" > /etc/exports
              rpcbind -w
              exportfs -arv
              rpc.statd --port 32767 --no-notify
              rpc.nfsd -d 8 2 || rpc.nfsd 2 || true
              rpc.mountd --port 32765 --foreground --no-nfs-version 4
          volumeMounts:
            - name: nfs-data
              mountPath: /shared
      volumes:
        - name: nfs-data
          persistentVolumeClaim:
            claimName: nfs-server-data
