apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-refresh
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/leestana01/gitops.git
    targetRevision: main
    path: apps/argocd-refresh/base

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
