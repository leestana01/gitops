global:
  domain: argocd.klr.kr

server:
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/whitelist-source-range: "10.0.10.0/24,10.0.100.0/24,10.13.13.0/24,10.8.0.0/24"
    hostname: argocd.klr.kr
    tls: true
    extraTls:
      - secretName: argocd-klr-kr-tls
        hosts:
          - argocd.klr.kr

configs:
  params:
    server.insecure: true
