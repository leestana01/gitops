global:
  domain: argocd.klr.kr

server:
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/whitelist-source-range: "10.0.10.0/24,10.0.100.0/24"
    hostname: argocd.klr.kr
    tls: true
    extraTls:
      - secretName: argocd-klr-kr-tls
        hosts:
          - argocd.klr.kr

configs:
  params:
    server.insecure: true

# Discord 알림. Application 당 아래 어노테이션으로 구독:
#   notifications.argoproj.io/subscribe.on-deployed.discord: ""
#   notifications.argoproj.io/subscribe.on-sync-failed.discord: ""
#   notifications.argoproj.io/subscribe.on-health-degraded.discord: ""
#
# webhook URL 은 repo 에 두지 않는다(README 참고). 별도로 아래 secret 을
# 수동 생성한다. Helm 이 관리하지 않도록 secret.create: false.
#   kubectl create secret generic argocd-notifications-secret -n argocd \
#     --from-literal=discord-webhook-url='https://discord.com/api/webhooks/...'
notifications:
  enabled: true
  argocdUrl: https://argocd.klr.kr

  secret:
    create: false

  notifiers:
    service.webhook.discord: |
      url: $discord-webhook-url
      headers:
      - name: Content-Type
        value: application/json

  templates:
    # 최초 sync 성공 + Healthy 상태 진입 시 1회. oncePer 로 동일 revision 중복 알림 방지
    # (키는 공유 레포 HEAD 가 아니라 그 앱이 실제 sync 한 리비전이어야 한다).
    template.app-deployed: |
      webhook:
        discord:
          method: POST
          body: |
            {
              "username": "ArgoCD",
              "avatar_url": "https://argo-cd.readthedocs.io/en/stable/assets/logo.png",
              "embeds": [{
                "title": ":rocket: {{.app.metadata.name}} deployed",
                "url": "{{.context.argocdUrl}}/applications/{{.app.metadata.name}}",
                "color": 3066993,
                "fields": [
                  {"name": "Namespace", "value": "{{.app.spec.destination.namespace}}", "inline": true},
                  {"name": "Sync",      "value": "{{.app.status.sync.status}}",         "inline": true},
                  {"name": "Health",    "value": "{{.app.status.health.status}}",       "inline": true},
                  {"name": "Revision",  "value": "{{printf `%.7s` .app.status.sync.revision}}", "inline": true},
                  {"name": "Path",      "value": "{{.app.spec.source.path}}",           "inline": true}
                ]
              }]
            }

    # sync 자체가 실패/에러 종결된 경우. operationState.message 는 user-content 이므로
    # toJson 으로 안전하게 JSON 문자열로 직렬화한다 (따옴표/개행 escape).
    template.app-sync-failed: |
      webhook:
        discord:
          method: POST
          body: |
            {
              "username": "ArgoCD",
              "avatar_url": "https://argo-cd.readthedocs.io/en/stable/assets/logo.png",
              "embeds": [{
                "title": ":x: {{.app.metadata.name}} sync failed",
                "url": "{{.context.argocdUrl}}/applications/{{.app.metadata.name}}",
                "color": 15158332,
                "fields": [
                  {"name": "Namespace", "value": "{{.app.spec.destination.namespace}}",  "inline": true},
                  {"name": "Phase",     "value": "{{.app.status.operationState.phase}}", "inline": true},
                  {"name": "Revision",  "value": "{{printf `%.7s` .app.status.sync.revision}}", "inline": true},
                  {"name": "Message",   "value": {{toJson .app.status.operationState.message}}, "inline": false}
                ]
              }]
            }

    # 런타임 헬스체크가 degraded 로 내려앉은 경우 (예: pod CrashLoopBackOff).
    template.app-health-degraded: |
      webhook:
        discord:
          method: POST
          body: |
            {
              "username": "ArgoCD",
              "avatar_url": "https://argo-cd.readthedocs.io/en/stable/assets/logo.png",
              "embeds": [{
                "title": ":warning: {{.app.metadata.name}} health degraded",
                "url": "{{.context.argocdUrl}}/applications/{{.app.metadata.name}}",
                "color": 15105570,
                "fields": [
                  {"name": "Namespace", "value": "{{.app.spec.destination.namespace}}", "inline": true},
                  {"name": "Health",    "value": "{{.app.status.health.status}}",       "inline": true},
                  {"name": "Sync",      "value": "{{.app.status.sync.status}}",         "inline": true}
                ]
              }]
            }

  triggers:
    # 같은 revision 에 대해 Healthy 로 진입한 최초 1회만 발송 — reconcile 반복으로
    # 동일 알림이 스팸되지 않게 한다.
    trigger.on-deployed: |
      - when: app.status.operationState.phase in ['Succeeded'] and app.status.health.status == 'Healthy'
        # oncePer 는 app.status.sync.revision 이면 안 된다. 그건 앱 고유 값이 아니라
        # 16개 앱이 공유하는 gitops 레포의 HEAD 라서, 어느 앱을 빌드하든 커밋 하나에
        # 모든 앱의 값이 새 SHA 로 바뀌고 전 앱이 알림을 쏜다(infra/ 만 고친 커밋에도 발송됨).
        # syncResult.revision 은 그 앱이 실제로 sync 오퍼레이션을 수행한 리비전이고,
        # 매니페스트가 안 바뀐 앱은 오퍼레이션 자체가 안 생겨 값이 그대로 유지된다.
        oncePer: app.status.operationState.syncResult.revision
        send: [app-deployed]

    trigger.on-sync-failed: |
      - when: app.status.operationState.phase in ['Error', 'Failed']
        send: [app-sync-failed]

    # Healthy → Degraded 전이 시 1회. 중복 방지를 위해 oncePer 에 시간(분) 기준 묶음.
    trigger.on-health-degraded: |
      - when: app.status.health.status == 'Degraded'
        send: [app-health-degraded]
