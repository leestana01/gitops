apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: onedayflex-frontend
  namespace: argocd
  annotations:
    notifications.argoproj.io/subscribe.on-deployed.discord: ""
    notifications.argoproj.io/subscribe.on-sync-failed.discord: ""
    notifications.argoproj.io/subscribe.on-health-degraded.discord: ""
spec:
  project: default

  source:
    repoURL: https://github.com/leestana01/gitops.git
    targetRevision: main
    path: apps/onedayflex-frontend/overlays/prod

  destination:
    server: https://kubernetes.default.svc
    namespace: onedayflex

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
