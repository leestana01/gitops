apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: temp-front-dev
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/leestana01/gitops.git
    targetRevision: main
    path: apps/temp-front/overlays/dev

  destination:
    server: https://kubernetes.default.svc
    namespace: gakhalmo-dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
