# 단일 shared NFS(OCI FSS)를 참조하는 PV/PVC — 블록볼륨을 새로 만들지 않는다(NFS-only 정책).
# 앱은 subPathExpr 로 /shared 아래 서브디렉토리(DATA_SUBPATH)만 사용한다.
# 저장 대상: SQLite DB, FilmCraft 프로젝트·Revision, 라이브러리 소재, 렌더 결과(mp4), 암호화 키.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: shorts-factory-nfs
spec:
  capacity:
    # NFS는 용량을 강제하지 않는 명목값 (블록볼륨 할당 아님).
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - nolock
  nfs:
    server: 10.96.78.207
    path: /shared
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: shorts-factory-data
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  volumeName: shorts-factory-nfs
  resources:
    requests:
      storage: 10Gi
