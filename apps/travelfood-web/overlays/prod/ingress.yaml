apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: travelfood-web
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - travelfood.klr.kr
      secretName: travelfood-klr-kr-tls
  rules:
    - host: travelfood.klr.kr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: travelfood-web
                port:
                  number: 3000
