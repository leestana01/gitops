apiVersion: apps/v1
kind: Deployment
metadata:
  name: leeshfield
  labels:
    app: leeshfield
spec:
  replicas: 1
  selector:
    matchLabels:
      app: leeshfield
  template:
    metadata:
      labels:
        app: leeshfield
    spec:
      priorityClassName: service-standard
      containers:
        - name: leeshfield
          image: yny.ocir.io/axlgn2n9ijoa/leeshfield/app
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: leeshfield-config
            - secretRef:
                name: leeshfield-secrets
          resources:
            requests:
              cpu: "50m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
      imagePullSecrets:
        - name: ocir-secret
