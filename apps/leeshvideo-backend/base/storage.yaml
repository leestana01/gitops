# 단일 shared NFS(OCI FSS)를 참조하는 PV/PVC — 블록볼륨을 새로 만들지 않는다(NFS-only 정책).
# 앱은 subPathExpr 로 /shared 아래 서브디렉토리만 사용한다. 출력 영상 미보관 정책이라
# 저장 대상은 입력 레퍼런스 임시 파일(TTL 최대 24h)뿐이다.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: leeshvideo-back-nfs
spec:
  capacity:
    # NFS는 용량을 강제하지 않는 명목값 (블록볼륨 할당 아님).
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - nolock
  nfs:
    server: 10.96.78.207
    path: /shared
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: leeshvideo-back-data
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  volumeName: leeshvideo-back-nfs
  resources:
    requests:
      storage: 10Gi
