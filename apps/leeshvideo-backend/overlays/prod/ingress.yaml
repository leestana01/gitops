apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: leeshvideo-back
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # 영상/오디오 레퍼런스 업로드 상한 (backend multipart 한도와 일치)
    nginx.ingress.kubernetes.io/proxy-body-size: "120m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.leeshvideo.klr.kr
      secretName: api-leeshvideo-klr-kr-tls
  rules:
    - host: api.leeshvideo.klr.kr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: leeshvideo-back
                port:
                  number: 8080
