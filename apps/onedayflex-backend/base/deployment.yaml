apiVersion: apps/v1
kind: Deployment
metadata:
  name: onedayflex-back
  labels:
    app: onedayflex-back
spec:
  replicas: 1
  selector:
    matchLabels:
      app: onedayflex-back
  template:
    metadata:
      labels:
        app: onedayflex-back
    spec:
      priorityClassName: revenue-critical
      containers:
        - name: onedayflex-back
          image: yny.ocir.io/axlgn2n9ijoa/onedayflex/back
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            # 비시크릿 env (overlay 에서 생성). nameSuffix 가 붙으면 자동 rewrite.
            - configMapRef:
                name: onedayflex-back-config
            # 시크릿 env (네임스페이스별로 수동 생성 — DB/JWT/Kakao/OpenAI).
            - secretRef:
                name: onedayflex-back-secrets
          volumeMounts:
            # 앱인토스 파트너 API mTLS 인증서(토스 로그인 + 인앱결제 주문검증 공용).
            - name: toss-mtls
              mountPath: /etc/toss-mtls
              readOnly: true
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 10
          # 종료 직전 잠깐 버틴다. k8s 는 엔드포인트 제거와 SIGTERM 을 동시에 보내므로,
          # 이 대기가 없으면 인그레스가 아직 이 파드로 보내는 사이에 서버가 내려가
          # 학습 요청이 503 으로 떨어진다(2026-08-06 배포 중 실사용자 21건 실패).
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
      # preStop 5초 + 진행 중 요청 처리 시간을 담을 만큼은 준다(기본 30초).
      terminationGracePeriodSeconds: 45
      volumes:
        # 네임스페이스별 수동 생성 Secret. 없는 환경(dev)에서도 기동되도록 optional.
        - name: toss-mtls
          secret:
            secretName: onedayflex-toss-mtls
            optional: true
      imagePullSecrets:
        - name: ocir-secret
