apiVersion: v1
kind: ConfigMap
metadata:
  name: onedayflex-back-config
data:
  SPRING_PROFILES_ACTIVE: "prod"
  # 마이그레이션 도구 도입 전까지 update 로 스키마 부트스트랩.
  JPA_DDL_AUTO: "update"
  CORS_ALLOWED_ORIGINS: "https://onedayflex.klr.kr"
  # Swagger: prod 는 완전 차단.
  SPRINGDOC_APIDOCS_ENABLED: "false"
  SPRINGDOC_SWAGGERUI_ENABLED: "false"
  # OpenAI 콘텐츠 생성 — 풀 하한 유지 + 일일 상한으로 비용 통제.
  OPENAI_MODEL: "gpt-4o-mini"
  CONTENT_GEN_DAILY_CAP: "400"
  # DB endpoint (non-secret). 자격증명은 Secret 의 SPRING_DATASOURCE_USERNAME/PASSWORD.
  SPRING_DATASOURCE_URL: "jdbc:mysql://heatwave-mysql.subnetprivate02.armvcn.oraclevcn.com:3306/onedayflex?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8"
