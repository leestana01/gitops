apiVersion: v1
kind: ConfigMap
metadata:
  name: onedayflex-back-config
data:
  SPRING_PROFILES_ACTIVE: "prod"
  # 컨테이너 기본은 UTC 라 LocalDate/LocalTime 이 전부 UTC 로 돈다.
  # 푸시 발송 시각·야간 금지 시간대·일일 한도·스트릭 날짜 경계가 모두 여기에 걸리므로
  # 서비스 기준 시간대(KST)를 명시한다. (미설정 시 20시 발송 = 한국 새벽 5시)
  TZ: "Asia/Seoul"
  # 마이그레이션 도구 도입 전까지 update 로 스키마 부트스트랩.
  JPA_DDL_AUTO: "update"
  # "*" 허용: 쿠키/세션 미사용(JWT 헤더, allowCredentials=false)이라 CORS 개방 위험 없음.
  # 토스 콘솔의 콜백 테스트가 브라우저 fetch 로 들어와 특정 오리진 제한 시 실패한다.
  CORS_ALLOWED_ORIGINS: "*"
  # Swagger: prod 는 완전 차단.
  SPRINGDOC_APIDOCS_ENABLED: "false"
  SPRINGDOC_SWAGGERUI_ENABLED: "false"
  # OpenAI 콘텐츠 생성 — 풀 하한 유지 + 일일 상한으로 비용 통제.
  OPENAI_MODEL: "gpt-4o-mini"
  CONTENT_GEN_DAILY_CAP: "400"
  # 앱인토스 메신저 푸시 스케줄러. 콘솔에 승인된 템플릿(16종)이 등록돼 있어야 발송된다.
  APP_PUSH_ENABLED: "true"
  # 단어 발음 음원(OCI 오브젝트 스토리지, 공개 읽기). 뒤에 {lang}/{wordId}.mp3 가 붙는다.
  # 토스 안드로이드 WebView 에 음성합성 API 가 없어 파일 재생으로 대체했다.
  APP_AUDIO_BASE_URL: "https://objectstorage.ap-chuncheon-1.oraclecloud.com/n/axlgn2n9ijoa/b/onedayflex-audio/o/"
  # 인앱결제 상품 ID — 콘솔이 발급한 값(요청자 지정 불가). 비어 있으면 앱 채널 구독은
  # IAP_NOT_CONFIGURED 로 폴백하고 코스 결제 버튼이 잠긴다. 비밀값이 아니라 ConfigMap 에 둔다.
  #
  # 구독만 결제창에서 "상품을 살 수 없어요" 로 끝난다. minDeploymentId(null/라이브 지정)와
  # 오퍼 유무를 다 바꿔 봐도 동일했고, 앱에서 IAP.getProductItemList() 를 찍어 보니 원인이 보였다:
  #   코스   CONSUMABLE    (오퍼 개념 없음)  → 결제창 연결됨
  #   월간   SUBSCRIPTION  offers: []       → 실패
  #   연간   SUBSCRIPTION  offers: []       → 실패
  # 상품과 sku 는 스토어에 정상으로 올라와 있는데 구독에 붙은 요금제·오퍼가 하나도 없다.
  # 그래서 앱이 offerId 없이 호출하고 스토어가 판매 조건을 몰라 거절한다.
  #
  # 콘솔 discountPolicies 가 스토어 offers 로 실제 반영되는지 가르려고 월간만
  # 오퍼(FREE_TRIAL 1주) 붙은 상품으로 되돌린다. 연간은 오퍼 없는 상품 그대로 두어 대조한다.
  # 월간 offers 가 채워지면 우리 설정 문제, 여전히 비면 스토어 등록 쪽 문제로 확정된다.
  APP_IAP_MONTHLY_SKU: "sub.1a3c.mse9d4eb.54a310c952"
  APP_IAP_YEARLY_SKU: "sub.1a3c.mseljjrh.17b616c9a2"
  APP_IAP_COURSE_SKU: "ait.0000059736.5903855d.f8996af828.5822350083"
  # 앱인토스 파트너 API mTLS — Secret onedayflex-toss-mtls 를 /etc/toss-mtls 로 마운트.
  APP_TOSS_MTLS_CERT_PATH: "/etc/toss-mtls/tls.crt"
  APP_TOSS_MTLS_KEY_PATH: "/etc/toss-mtls/tls.key"
  # DB endpoint (non-secret). 자격증명은 Secret 의 SPRING_DATASOURCE_USERNAME/PASSWORD.
  SPRING_DATASOURCE_URL: "jdbc:mysql://heatwave-mysql.subnetprivate02.armvcn.oraclevcn.com:3306/onedayflex?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8"
