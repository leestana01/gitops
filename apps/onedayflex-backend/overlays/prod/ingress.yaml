apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: onedayflex-back
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.onedayflex.klr.kr
      secretName: api-onedayflex-klr-kr-tls
  rules:
    - host: api.onedayflex.klr.kr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: onedayflex-back
                port:
                  number: 8080
