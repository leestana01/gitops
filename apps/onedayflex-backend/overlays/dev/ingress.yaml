apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: onedayflex-back
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    # dev는 내부망 전용 — K8s 노드망 + WireGuard VPN 클라이언트만 허용 (argocd/jenkins와 동일).
    nginx.ingress.kubernetes.io/whitelist-source-range: "10.0.10.0/24,10.0.100.0/24"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.dev.onedayflex.klr.kr
      secretName: api-dev-onedayflex-klr-kr-tls
  rules:
    - host: api.dev.onedayflex.klr.kr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: onedayflex-back
                port:
                  number: 8080
