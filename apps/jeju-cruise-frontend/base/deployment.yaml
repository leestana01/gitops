apiVersion: apps/v1
kind: Deployment
metadata:
  name: jeju-cruise-front
  labels:
    app: jeju-cruise-front
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jeju-cruise-front
  template:
    metadata:
      labels:
        app: jeju-cruise-front
    spec:
      containers:
        - name: jeju-cruise-front
          image: yny.ocir.io/axlgn2n9ijoa/jeju-cruise/front
          ports:
            - containerPort: 3000
              name: http
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
      imagePullSecrets:
        - name: ocir-secret
