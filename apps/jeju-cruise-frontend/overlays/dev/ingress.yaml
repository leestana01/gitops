apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jeju-cruise-front
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # dev는 내부망 전용 — K8s 노드망 + WireGuard VPN 클라이언트만 허용 (argocd/jenkins와 동일).
    nginx.ingress.kubernetes.io/whitelist-source-range: "10.0.10.0/24,10.0.100.0/24"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - dev.cruise.klr.kr
      secretName: dev-cruise-klr-kr-tls
  rules:
    - host: dev.cruise.klr.kr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jeju-cruise-front
                port:
                  number: 3000
