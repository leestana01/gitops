apiVersion: apps/v1
kind: Deployment
metadata:
  name: gakhalmo-front-dev
  namespace: gakhalmo-dev
  labels:
    app: gakhalmo-front-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gakhalmo-front-dev
  template:
    metadata:
      labels:
        app: gakhalmo-front-dev
    spec:
      containers:
        - name: gakhalmo-front-dev
          image: yny.ocir.io/axlgn2n9ijoa/gakhalmo/front:dev-1
          ports:
            - containerPort: 3000
              name: http
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
      imagePullSecrets:
        - name: ocir-secret
