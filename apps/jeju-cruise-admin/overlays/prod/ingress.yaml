apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jeju-cruise-admin
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # 내부망 한정 — 임시 해제됨. 되돌리려면 아래 줄의 주석을 풀면 된다.
    # 운영자 전용 콘솔 — K8s 노드망 + WireGuard VPN 클라이언트만 허용 (argocd/jenkins/dev와 동일 패턴).
    # nginx.ingress.kubernetes.io/whitelist-source-range: "10.0.10.0/24,10.0.100.0/24"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - admin.cruise.klr.kr
      secretName: admin-cruise-klr-kr-tls
  rules:
    - host: admin.cruise.klr.kr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jeju-cruise-admin
                port:
                  number: 80
