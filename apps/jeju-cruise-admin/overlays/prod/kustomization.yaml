apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Namespace `cruise` is created/owned by the frontend overlay (ArgoCD CreateNamespace),
# so this app does not include namespace.yaml (avoids duplicate-owner conflicts) — same
# convention as jeju-cruise-backend.
resources:
  - ../../base
  - ingress.yaml
namespace: cruise
images:
  - name: yny.ocir.io/axlgn2n9ijoa/jeju-cruise/admin
    newTag: prod-2
