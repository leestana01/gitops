apiVersion: apps/v1
kind: Deployment
metadata:
  name: gakhalmo-back-dev
  namespace: gakhalmo-dev
  labels:
    app: gakhalmo-back-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gakhalmo-back-dev
  template:
    metadata:
      labels:
        app: gakhalmo-back-dev
    spec:
      containers:
        - name: gakhalmo-back-dev
          image: yny.ocir.io/axlgn2n9ijoa/gakhalmo/back:dev-1
          ports:
            - containerPort: 8000
              name: http
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
      imagePullSecrets:
        - name: ocir-secret
