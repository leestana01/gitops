apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gakhalmo-back-dev
  namespace: gakhalmo-dev
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.dev.gakhalmo.klr.kr
      secretName: api-dev-gakhalmo-klr-kr-tls
  rules:
    - host: api.dev.gakhalmo.klr.kr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gakhalmo-back-dev
                port:
                  number: 8000
