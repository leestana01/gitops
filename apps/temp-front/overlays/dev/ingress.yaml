apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: temp-front
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/whitelist-source-range: "10.0.10.0/24,10.0.100.0/24"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - temp.gakhalmo.klr.kr
      secretName: temp-gakhalmo-klr-kr-tls
  rules:
    - host: temp.gakhalmo.klr.kr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: temp-front
                port:
                  number: 80
