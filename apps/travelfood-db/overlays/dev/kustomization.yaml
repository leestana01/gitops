apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - namespace.yaml
namespace: travelfood-dev
nameSuffix: -dev
# nameSuffix 로 StatefulSet/Service 이름은 -dev 가 붙지만, StatefulSet 의
# spec.serviceName 은 kustomize 가 자동 재작성하지 못하므로 patch 로 맞춘다.
patches:
  - patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: travelfood-db
      spec:
        serviceName: travelfood-db-dev
