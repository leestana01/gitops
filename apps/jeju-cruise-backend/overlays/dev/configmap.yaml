apiVersion: v1
kind: ConfigMap
metadata:
  name: jeju-cruise-back-config
data:
  SPRING_PROFILES_ACTIVE: "dev"
  JPA_DDL_AUTO: "update"
  # Payment (non-secret). PayPal 은 모든 환경 공통 sandbox.
  PAYMENT_CURRENCY: "KRW"
  SETTLEMENT_CURRENCY: "USD"
  FX_RATE: "1350"
  APP_PAYMENT_PAYPAL_ENVIRONMENT: "SANDBOX"
  # Tokens / CORS
  JWT_ACCESS_TTL: "1800"
  JWT_REFRESH_TTL: "1209600"
  VOUCHER_TOKEN_TTL: "180"
  CORS_ALLOWED_ORIGINS: "https://dev.cruise.klr.kr"
  # Swagger: dev 는 JSON(api-docs)만 노출, 인터랙티브 UI 는 끔.
  SPRINGDOC_APIDOCS_ENABLED: "true"
  SPRINGDOC_SWAGGERUI_ENABLED: "false"
  # RAG chatbot. Vault (SoT) on NFS. Providers default to keyless local/stub; switch to
  # voyage/anthropic once APP_RAG_EMBEDDING_API_KEY / APP_RAG_CHAT_API_KEY are set in the Secret.
  RAG_VAULT_PATH: "/data/vault"
  RAG_EMBEDDING_PROVIDER: "openai"
  RAG_EMBEDDING_MODEL: "text-embedding-3-small"
  RAG_EMBEDDING_BASE_URL: "https://api.openai.com/v1/embeddings"
  RAG_CHAT_PROVIDER: "openai"
  RAG_CHAT_MODEL: "gpt-4o-mini"
  RAG_CHAT_BASE_URL: "https://api.openai.com/v1/chat/completions"
  # DB endpoint (non-secret). 자격증명은 Secret 의 SPRING_DATASOURCE_USERNAME/PASSWORD.
  SPRING_DATASOURCE_URL: "jdbc:mysql://heatwave-mysql.subnetprivate02.armvcn.oraclevcn.com:3306/jeju_moyoung?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8"
