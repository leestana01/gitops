apiVersion: v1
kind: ConfigMap
metadata:
  name: jeju-cruise-back-config
data:
  SPRING_PROFILES_ACTIVE: "prod"
  # No migration tooling yet; "update" lets the schema bootstrap. Switch to "validate"
  # once Flyway/Liquibase is introduced.
  JPA_DDL_AUTO: "update"
  # Payment (non-secret). Test(sandbox) 키만 확보 → 모든 환경 SANDBOX 공통.
  PAYMENT_CURRENCY: "KRW"
  SETTLEMENT_CURRENCY: "USD"
  FX_RATE: "1350"
  APP_PAYMENT_PAYPAL_ENVIRONMENT: "SANDBOX"
  # Tokens / CORS
  JWT_ACCESS_TTL: "1800"
  JWT_REFRESH_TTL: "1209600"
  VOUCHER_TOKEN_TTL: "180"
  CORS_ALLOWED_ORIGINS: "https://cruise.klr.kr"
  # DB endpoint (non-secret). 현재 dev 와 동일 DB — 실서비스 전 prod 전용 스키마 분리 권장.
  SPRING_DATASOURCE_URL: "jdbc:mysql://heatwave-mysql.subnetprivate02.armvcn.oraclevcn.com:3306/jeju_moyoung?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8"
