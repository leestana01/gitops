# 단일 shared NFS(OCI FSS)를 참조하는 PV/PVC — 신규 블록볼륨을 만들지 않는다.
# 앱은 subPath 로 /shared 아래 서브디렉토리(jeju-cruise-back/vault)만 사용한다.
# 이 볼트(마크다운 파일)가 RAG 챗봇의 Source of Truth 이며 Obsidian 으로도 편집 가능하다.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: jeju-cruise-back-nfs
spec:
  capacity:
    # NFS는 용량을 강제하지 않는 명목값.
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  nfs:
    server: 10.96.78.207
    path: /shared
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jeju-cruise-back-data
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  volumeName: jeju-cruise-back-nfs
  resources:
    requests:
      storage: 5Gi
