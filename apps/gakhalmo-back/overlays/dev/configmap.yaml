apiVersion: v1
kind: ConfigMap
metadata:
  name: gakhalmo-back-config
data:
  ENV: "dev"
  DEBUG: "false"
  LOG_LEVEL: "DEBUG"
  LOG_JSON: "true"
  DATABASE_ECHO: "false"
  CORS_ORIGINS: "https://dev.gakhalmo.klr.kr"
  JWT_ALGORITHM: "HS256"
  ACCESS_TOKEN_EXPIRE_MINUTES: "30"
  REFRESH_TOKEN_EXPIRE_DAYS: "14"
  BCRYPT_ROUNDS: "12"
  GOOGLE_REDIRECT_URI: "https://api.dev.gakhalmo.klr.kr/api/v1/auth/google/callback"
  OAUTH_STATE_TTL_SECONDS: "600"
  AUTH_ALLOW_GOOGLE_AUTOLINK: "true"
  RUN_STARTUP_SEED: "true"
