apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gakhalmo-back
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/whitelist-source-range: "10.0.10.0/24,10.0.100.0/24"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.dev.gakhalmo.klr.kr
      secretName: api-dev-gakhalmo-klr-kr-tls
  rules:
    - host: api.dev.gakhalmo.klr.kr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gakhalmo-back
                port:
                  number: 8000
