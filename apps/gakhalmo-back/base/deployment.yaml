apiVersion: apps/v1
kind: Deployment
metadata:
  name: gakhalmo-back
  labels:
    app: gakhalmo-back
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gakhalmo-back
  template:
    metadata:
      labels:
        app: gakhalmo-back
    spec:
      containers:
        - name: gakhalmo-back
          image: yny.ocir.io/axlgn2n9ijoa/gakhalmo/back
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            # 비시크릿 env (overlay 에서 생성). nameSuffix 가 붙은 경우 자동 rewrite.
            - configMapRef:
                name: gakhalmo-back-config
            # 시크릿 env (SealedSecret 혹은 ESO 가 생성, overlay 별 네임스페이스).
            - secretRef:
                name: gakhalmo-back-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
      imagePullSecrets:
        - name: ocir-secret
