apiVersion: apps/v1
kind: Deployment
metadata:
  name: gakhalmo-back
  namespace: gakhalmo
  labels:
    app: gakhalmo-back
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gakhalmo-back
  template:
    metadata:
      labels:
        app: gakhalmo-back
    spec:
      containers:
        - name: gakhalmo-back
          image: yny.ocir.io/axlgn2n9ijoa/gakhalmo/back:prod-1
          ports:
            - containerPort: 8000
              name: http
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
      imagePullSecrets:
        - name: ocir-secret
