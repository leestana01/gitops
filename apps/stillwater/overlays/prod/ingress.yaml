apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: stillwater
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - stillwater.klr.kr
      secretName: stillwater-klr-kr-tls
  rules:
    - host: stillwater.klr.kr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: stillwater
                port:
                  number: 8080
