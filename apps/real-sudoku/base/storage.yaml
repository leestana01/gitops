# 단일 shared NFS(OCI FSS)를 참조하는 PV/PVC — 블록볼륨을 새로 만들지 않는다.
# SQLite는 fcntl(POSIX) 락을 쓰는데 이 NFS의 원격 락 매니저에서 멈추므로,
# nolock 마운트로 커널-로컬 락을 쓰게 한다(단일 writer라 안전). 앱은 subPath 로
# /shared 아래 서브디렉토리만 사용한다.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: real-sudoku-web-nfs
spec:
  capacity:
    # NFS는 용량을 강제하지 않는 명목값 (블록볼륨 할당 아님).
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - nolock
  nfs:
    server: 10.96.78.207
    path: /shared
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: real-sudoku-web-data
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  volumeName: real-sudoku-web-nfs
  resources:
    requests:
      storage: 10Gi
