apiVersion: apps/v1
kind: Deployment
metadata:
  name: real-sudoku-web
  labels:
    app: real-sudoku-web
spec:
  replicas: 1
  # SQLite 단일 파일 + 인메모리 매칭 큐 + SSE 장기 연결을 쓰므로 수평 확장 불가.
  # 단일 파드가 NFS 서브디렉토리에 DB를 쓰며, 롤아웃 시 신구 파드 동시 접근을
  # 막으려 Recreate 로 구 파드 종료 후 재기동한다.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: real-sudoku-web
  template:
    metadata:
      labels:
        app: real-sudoku-web
    spec:
      priorityClassName: service-standard
      # NFS export 가 no_root_squash 라 kubelet 이 subPath 디렉토리를 root 로 만든다.
      # 비root 앱(uid 1001)이 쓸 수 있도록 initContainer(root)로 소유권을 맞춘다.
      initContainers:
        - name: init-data-perms
          image: docker.io/library/busybox:1.36
          command: ["sh", "-c", "chown -R 1001:1001 /data"]
          securityContext:
            runAsUser: 0
          env:
            - name: DATA_SUBPATH
              valueFrom:
                configMapKeyRef:
                  name: real-sudoku-web-config
                  key: DATA_SUBPATH
          volumeMounts:
            - name: data
              mountPath: /data
              subPathExpr: $(DATA_SUBPATH)
      containers:
        - name: real-sudoku-web
          image: yny.ocir.io/axlgn2n9ijoa/real-sudoku/web
          ports:
            - containerPort: 3000
              name: http
          env:
            # subPathExpr 확장을 위해 명시적으로 노출 (envFrom 만으로는 확장이 보장되지 않음).
            - name: DATA_SUBPATH
              valueFrom:
                configMapKeyRef:
                  name: real-sudoku-web-config
                  key: DATA_SUBPATH
            # Next.js standalone은 HOSTNAME(기본은 파드명)에 바인딩한다. 모든 인터페이스에
            # 바인딩하도록 명시해 프로브·서비스 라우팅을 안정화한다.
            - name: HOSTNAME
              value: "0.0.0.0"
            # MySQL 비밀번호는 git에 두지 않는다 — 네임스페이스별 수동 생성 시크릿.
            # (재생성: kubectl -n <ns> create secret generic real-sudoku-mysql --from-literal=MYSQL_PASSWORD=...)
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: real-sudoku-mysql
                  key: MYSQL_PASSWORD
          envFrom:
            - configMapRef:
                name: real-sudoku-web-config
          volumeMounts:
            # 단일 shared NFS 의 앱별 서브디렉토리를 /data 로 마운트 (신규 PVC 미생성).
            - name: data
              mountPath: /data
              subPathExpr: $(DATA_SUBPATH)
          resources:
            requests:
              cpu: "50m"
              memory: "256Mi"
            limits:
              # 퍼즐 생성(특히 MASTER)이 요청 스레드에서 CPU 버스트를 낸다.
              cpu: "1"
              memory: "768Mi"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        # 클러스터 공용 단일 NFS(OCI FSS)를 nolock 으로 마운트하는 PVC(storage.yaml).
        # SQLite fcntl 락이 NFS 원격 락 매니저에서 멈추는 문제를 피한다. subPath 로
        # 서브디렉토리만 사용하므로 블록볼륨을 새로 만들지 않는다.
        - name: data
          persistentVolumeClaim:
            claimName: real-sudoku-web-data
      imagePullSecrets:
        - name: ocir-secret
