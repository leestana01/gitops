apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: onedayflex-admin
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # 운영자 전용 콘솔 — K8s 노드망 + WireGuard VPN 클라이언트만 허용 (argocd/jenkins와 동일).
    # 외부에서 접근이 필요하면 이 줄을 주석 처리한다 (X-Admin-Key 인증은 별도로 유지됨).
    nginx.ingress.kubernetes.io/whitelist-source-range: "10.0.10.0/24,10.0.100.0/24"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - admin.onedayflex.klr.kr
      secretName: admin-onedayflex-klr-kr-tls
  rules:
    - host: admin.onedayflex.klr.kr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: onedayflex-admin
                port:
                  number: 3000
