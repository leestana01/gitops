apiVersion: apps/v1
kind: Deployment
metadata:
  name: jenkins
  namespace: jenkins
  labels:
    app: jenkins
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jenkins
  template:
    metadata:
      labels:
        app: jenkins
    spec:
      priorityClassName: build-low
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
      imagePullSecrets:
        - name: oci-registry-secret
      initContainers:
        - name: init-jenkins-home
          image: busybox:latest
          command: ['sh', '-c', 'mkdir -p /var/jenkins_home && chown -R 1000:1000 /var/jenkins_home']
          volumeMounts:
            - name: jenkins-data
              mountPath: /var/jenkins_home
              subPath: jenkins
          securityContext:
            runAsUser: 0
      containers:
        - name: jenkins
          image: yny.ocir.io/axlgn2n9ijoa/jenkins:2.555.1-jdk21
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 50000
              name: agent
          env:
            - name: JAVA_OPTS
              value: "-Xmx1024m -Xms512m -Djenkins.install.runSetupWizard=false -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/var/jenkins_home/heapdump.hprof"
          volumeMounts:
            - name: jenkins-data
              mountPath: /var/jenkins_home
              subPath: jenkins
          resources:
            requests:
              memory: "768Mi"
              cpu: "100m"
            limits:
              memory: "1536Mi"
              cpu: "1500m"
          startupProbe:
            httpGet:
              path: /login
              port: 8080
            periodSeconds: 10
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /login
              port: 8080
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /login
              port: 8080
            periodSeconds: 5
      volumes:
        - name: jenkins-data
          persistentVolumeClaim:
            claimName: jenkins-nfs
