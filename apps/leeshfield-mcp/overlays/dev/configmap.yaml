apiVersion: v1
kind: ConfigMap
metadata:
  name: leeshfield-mcp-config
data:
  # 브라우저용 인가 서버 주소 (PRM authorization_servers)
  LEESHFIELD_URL: "https://dev.leeshfield.klr.kr"
  # 서버 간 호출(API·introspection)은 클러스터 내부 Service로 — 인그레스 화이트리스트 우회
  LEESHFIELD_INTERNAL_URL: "http://leeshfield-dev.leeshfield-dev.svc.cluster.local:3000"
  MCP_PUBLIC_URL: "https://dev.leeshfield-mcp.klr.kr"
