apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: leeshfield-mcp
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # upload_asset이 base64 본문을 받으므로 본체와 동일 한도
    nginx.ingress.kubernetes.io/proxy-body-size: "512m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    # dev — VPC 내부(WireGuard 포함)만 접근 허용
    nginx.ingress.kubernetes.io/whitelist-source-range: "10.0.10.0/24,10.0.100.0/24"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - dev.leeshfield-mcp.klr.kr
      secretName: dev-leeshfield-mcp-klr-kr-tls
  rules:
    - host: dev.leeshfield-mcp.klr.kr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: leeshfield-mcp
                port:
                  number: 3000
