apiVersion: apps/v1
kind: Deployment
metadata:
  name: onedayflex-front
  labels:
    app: onedayflex-front
spec:
  replicas: 1
  selector:
    matchLabels:
      app: onedayflex-front
  template:
    metadata:
      labels:
        app: onedayflex-front
    spec:
      priorityClassName: revenue-critical
      containers:
        - name: onedayflex-front
          image: yny.ocir.io/axlgn2n9ijoa/onedayflex/front
          ports:
            - containerPort: 3000
              name: http
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "300m"
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5
      imagePullSecrets:
        - name: ocir-secret
