apiVersion: apps/v1
kind: Deployment
metadata:
  name: snappymail
  namespace: mail
  labels:
    app: snappymail
spec:
  replicas: 1
  selector:
    matchLabels:
      app: snappymail
  template:
    metadata:
      labels:
        app: snappymail
    spec:
      priorityClassName: service-standard
      initContainers:
        - name: init-domain-config
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              DOMAIN_DIR="/data/_data_/_default_/domains"
              mkdir -p "$DOMAIN_DIR"
              cp /domain-config/klr.kr.json "$DOMAIN_DIR/klr.kr.json"
              chown -R 82:82 /data/_data_
              echo "Domain config injected"
          volumeMounts:
            - name: snappymail-data
              mountPath: /data
              subPath: snappymail
            - name: domain-config
              mountPath: /domain-config
      containers:
        - name: snappymail
          image: docker.io/djmaze/snappymail:latest
          ports:
            - containerPort: 8888
              name: http
          volumeMounts:
            - name: snappymail-data
              mountPath: /var/lib/snappymail
              subPath: snappymail
          resources:
            requests:
              memory: "128Mi"
              cpu: "25m"
            limits:
              memory: "256Mi"
              cpu: "250m"
      volumes:
        - name: snappymail-data
          persistentVolumeClaim:
            claimName: mail-nfs
        - name: domain-config
          configMap:
            name: snappymail-domain-config
